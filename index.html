<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Rexon Field Patrolling App</title>
    <meta name="description" content="Security company owner operations dashboard for Rexon Field Patrolling App, managing sites, field officers, patrols, checklists, and incident response." />
    <meta property="og:title" content="Rexon Field Patrolling App" />
    <meta property="og:description" content="Security company owner operations dashboard for Rexon Field Patrolling App, managing sites, field officers, patrols, checklists, and incident response." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3a2d28" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rexon" />

    <!-- PWA App Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8F5EF] text-[#4B3621] font-sans antialiased selection:bg-[#E8D8C5] selection:text-[#4B3621]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Safe Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('Rexon PWA ServiceWorker registration successful with scope:', reg.scope);
            })
            .catch(function(err) {
              console.error('Rexon PWA ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
